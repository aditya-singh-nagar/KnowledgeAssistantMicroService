spring.application.name=ApiGateway

server.port = 9090

# Tells the Eureka client NOT to register itself with this Eureka instance
eureka.client.register-with-eureka=true

# Tells the Eureka client NOT to pull registry information locally
eureka.client.fetch-registry=true


secret=${JWT_SECRET:U1pEWEdWQk1kZmFlZ3NyaGRmaGpnaGhrLGpnZmZkczEyMzQ1Njc2NTQzMjM0JCVeJiopKComXiUkIyQlXllVUComXiUkI0RGR0NIVkpCIjpMS0pISEdGR0hK}


# Optional: Points to itself to prevent fallback/error logs looking for a cluster peer
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}


